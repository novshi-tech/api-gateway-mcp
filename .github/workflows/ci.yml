name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            murmur/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The Worker bundles Murmur (docs/adr/0005): make sure it still builds.
      - run: npx wrangler deploy --dry-run --outdir dist/dry-run -c wrangler.example.jsonc


  murmur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murmur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: murmur/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run scenario verify all
      - run: npx wrangler deploy --dry-run --outdir dist -c wrangler.example.jsonc
