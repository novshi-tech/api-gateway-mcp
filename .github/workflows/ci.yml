name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm scenario verify all
      - run: pnpm exec wrangler deploy --dry-run --outdir dist -c wrangler.example.jsonc


  # デプロイは CI でしない。デプロイの設定は各デプロイする人の private リポジトリにあり
  # （deployments/ に clone する）、pnpm run deploy <名前> で出す（docs/adr/0029）
